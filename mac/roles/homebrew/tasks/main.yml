- name: update
  community.general.homebrew:
    update_homebrew: yes
- name: homebrew tap
  community.general.homebrew_tap:
    name: "{{ item }}"
    state: present
  with_items: "{{ homebrew_taps }}"
- name: homebrew packages install
  community.general.homebrew:
    name: "{{ item.name }}"
    state: latest
    install_options: "{{ item.install_options | default('') }}"
  with_items: "{{ homebrew_packages }}"
- name: unlink
  community.general.homebrew:
    name: "{{ item.name }}"
    state: unlinked
  with_items: "{{ homebrew_packages }}"
- name: link
  community.general.homebrew:
    name: "{{ item.name }}"
    state: linked
  with_items: "{{ homebrew_packages }}"
- name: homebrew casks install
  community.general.homebrew_cask: name={{ item.name }} state=latest
  environment:
    HOMEBREW_CASK_OPTS: "--appdir=/Applications"
  with_items: "{{ homebrew_casks }}"
